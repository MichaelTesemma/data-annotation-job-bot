[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-annotation-job-bot"
version = "0.1.0"
description = "Crawls data annotation jobs and serves a local dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "playwright>=1.44",
    "schedule>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools]
packages = ["scrapers", "dashboard", "data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
